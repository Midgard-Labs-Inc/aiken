[package]
name = "aiken"
version.workspace = true
edition.workspace = true
description.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
publish.workspace = true

[package.metadata.dist]
# publish = false would otherwise exclude this package from dist
dist = true

# Set on this crate only so the CHANGELOG is rewritten once per release, not
# once per workspace member.
[package.metadata.release]
pre-release-replacements = [
  { file = "../../CHANGELOG.md", search = "## unreleased", replace = "## unreleased\n\n## v{{version}} - {{date}}", exactly = 1 },
]

[package.metadata.wix]
upgrade-guid = "288B160D-418A-4558-91B9-7C38CFD789C7"
path-guid = "4EB8FCD6-261B-4F6C-B7DB-CFA67B4E6960"
license = false
eula = false

[dependencies]
aiken-lang.workspace = true
aiken-lsp.workspace = true
aiken-project.workspace = true
clap = { workspace = true, features = ["derive", "wrap_help", "unicode", "string"] }
clap_complete.workspace = true
color-print.workspace = true
hex.workspace = true
ignore.workspace = true
indoc.workspace = true
inquire.workspace = true
miette.workspace = true
num-bigint.workspace = true
ordinal.workspace = true
owo-colors = { workspace = true, features = ["supports-colors"] }
pallas-codec.workspace = true
pallas-primitives.workspace = true
pallas-addresses.workspace = true
pallas-traverse.workspace = true
rand.workspace = true
regex.workspace = true
serde_json.workspace = true
strum = { workspace = true, features = ["derive"] }
thiserror.workspace = true
uplc.workspace = true

[target.'cfg(not(windows))'.dependencies]
xdg.workspace = true
