name: Deploy Site

on:
  # Called by release.yml after a release is announced (post-announce-jobs in
  # dist-workspace.toml).
  workflow_call:
    inputs:
      plan:
        required: true
        type: string
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    # Prereleases still create a GitHub Release, but shouldn't replace the docs.
    # Manual runs have no plan, so they fall back to an empty object.
    if: ${{ !fromJson(inputs.plan || '{}').announcement_is_prerelease }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6
        with:
          version: 12.3.4

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy
        run: pnpm run deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
